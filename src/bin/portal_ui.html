<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src data: blob:; frame-src about:; worker-src blob:;">
<title>Yumon Portal</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; color: #e2eee7; }
  html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body { padding: 6px; }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: row;
    background: rgba(14, 23, 20, .94);
    border: 1px solid rgba(160, 220, 187, .24);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(16px);
  }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; user-select: none; cursor: grab; }
  h1 { font-size: 16px; letter-spacing: -.4px; margin: 0; font-weight: 650; }
  h1 span { color: #9dd8b3; font-weight: 400; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: #9dd8b3; margin-right: 2px; }
  .controls { margin-left: auto; display: flex; gap: 4px; }
  button { font: inherit; cursor: pointer; color: #a7bfb0; background: transparent; border: 1px solid transparent; border-radius: 7px; }
  .control { height: 28px; width: 28px; font-size: 18px; }
  button:hover { background: rgba(157, 216, 179, .1); color: #e2eee7; }
  button:focus-visible { outline: 2px solid #9dd8b3; outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
  #chat-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 10px; scrollbar-width: thin; scrollbar-color: #465f50 transparent; }
  .chat-empty { color: #8da596; font-size: 12px; line-height: 1.6; text-align: center; padding: 30px 12px; }
  .message { padding: 9px 11px; margin: 7px 0; border-radius: 10px; background: rgba(157, 216, 179, .07); }
  .message.user { margin-left: 20px; background: rgba(157, 216, 179, .13); }
  .message.yumon { margin-right: 20px; }
  .message.error { border: 1px solid #a77d65; }
  .message small { color: #9dd8b3; font-size: 10px; }
  .message p { margin: 3px 0 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  #chat-form { padding: 0 14px 10px; }
  .chat-actions { display: flex; justify-content: flex-end; padding: 0 14px 4px; }
  #chat-clear { padding: 4px 7px; font-size: 10px; border-color: rgba(157, 216, 179, .24); }
  .composer { display: flex; align-items: flex-end; gap: 6px; }
  #chat-input { flex: 1; min-width: 0; resize: none; border: 1px solid rgba(157, 216, 179, .24); border-radius: 8px; padding: 8px; color: #e2eee7; background: rgba(0, 0, 0, .15); font: inherit; font-size: 13px; line-height: 1.5; }
  #chat-input:focus { outline: 2px solid #9dd8b3; outline-offset: 1px; }
  #chat-send { padding: 8px 12px; border-color: rgba(157, 216, 179, .24); font-size: 12px; }
  #chat-status { margin: 5px 0 0; color: #92aa9a; font-size: 11px; line-height: 1.4; }

  #sim-pane { flex: 1 1 auto; min-width: 0; height: 100%; display: flex; flex-direction: column; background: #0e1714; border-right: 1px solid rgba(160, 220, 187, .2); }
  #side-panel { flex: 0 0 400px; min-width: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .sim-picker { display: flex; gap: 6px; padding: 10px 14px 8px; }
  .sim-choice { padding: 6px 12px; font-size: 12px; border-color: rgba(157, 216, 179, .13); }
  .sim-choice[aria-pressed="true"] { color: #c5efd3; background: rgba(157, 216, 179, .12); border-color: rgba(157, 216, 179, .3); }
  #sim-frame { flex: 1; min-height: 0; width: 100%; border: 0; border-top: 1px solid rgba(157, 216, 179, .13); background: #0e1714; }
</style>
</head>
<body>
<section id="shell" aria-label="Yumon Portal">
  <section id="sim-pane" aria-label="Simulations">
    <div class="sim-picker" role="group" aria-label="Simulation">
      <button class="sim-choice" id="sim-ant" type="button" data-sim="ant" aria-pressed="true">Yumon Ant</button>
      <button class="sim-choice" id="sim-chess" type="button" data-sim="chess" aria-pressed="false">WIR Chess</button>
    </div>
    <iframe id="sim-frame" title="Simulation" sandbox="allow-scripts"></iframe>
  </section>
  <section id="side-panel">
    <header id="drag"><span class="live" aria-hidden="true"></span><h1>yumon <span>portal</span></h1>
      <div class="controls"><button class="control" id="close" aria-label="Close Yumon Portal" title="Close">×</button></div>
    </header>
    <section id="chat-panel" aria-label="Chat">
      <div class="chat-actions"><button id="chat-clear" type="button">Clear Chat</button></div>
      <div id="chat-messages" role="log" aria-label="Conversation with Yumon" aria-live="polite"><p class="chat-empty">Say hello, ask a question, or share an idea with Yumon.</p></div>
      <form id="chat-form">
        <div class="composer"><textarea id="chat-input" rows="2" maxlength="4096" placeholder="Say something to Yumon..." aria-label="Message to Yumon"></textarea><button id="chat-send" type="submit" disabled>Send</button></div>
        <p id="chat-status" role="status">Waking Yumon up...</p>
      </form>
    </section>
  </section>
</section>

<script>/* __SIM_PAGES__ */</script>
<script>
  const send = (type, extra = {}) => window.ipc?.postMessage(JSON.stringify({ type, ...extra }));
  const EMPTY_CHAT = 'Say hello, ask a question, or share an idea with Yumon.';
  const simFrame = document.getElementById('sim-frame');
  const chatMessages = document.getElementById('chat-messages');
  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');
  const chatClear = document.getElementById('chat-clear');
  const simButtons = [...document.querySelectorAll('.sim-choice')];
  let canChat = false;
  let submitting = false;
  let submittedMessage = null;
  let submittedChatFingerprint = '';
  let renderedChat = '';
  let loadedSim = null;

  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = text;
    return node;
  };
  const showSim = name => {
    for (const button of simButtons) button.setAttribute('aria-pressed', String(button.dataset.sim === name));
    if (loadedSim === name) return;
    loadedSim = name;
    simFrame.srcdoc = window.__simPages?.[name] ?? '';
  };
  for (const button of simButtons) button.addEventListener('click', () => showSim(button.dataset.sim));

  const updateSend = () => { chatSend.disabled = !canChat || submitting || !chatInput.value.trim(); };
  chatInput.addEventListener('input', updateSend);
  chatClear.addEventListener('click', () => {
    send('clear_chat');
    chatMessages.replaceChildren(element('p', 'chat-empty', EMPTY_CHAT));
    chatInput.focus();
    submitting = false;
    submittedMessage = null;
  });
  document.getElementById('chat-form').addEventListener('submit', event => {
    event.preventDefault();
    const message = chatInput.value.trim();
    if (!canChat || submitting || !message) return;
    submitting = true;
    submittedMessage = message;
    submittedChatFingerprint = renderedChat;
    updateSend();
    send('chat', { message });
  });
  chatInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      document.getElementById('chat-form').requestSubmit();
    }
  });
  document.getElementById('close').addEventListener('click', () => send('close'));
  document.getElementById('drag').addEventListener('pointerdown', event => {
    if (event.button === 0 && !event.target.closest('button')) send('drag');
  });

  window.__yumon_portal = state => {
    canChat = state.can_chat && !state.chat_busy;
    document.getElementById('chat-status').textContent = state.chat_status;
    const messages = state.chat || [];
    const chatFingerprint = JSON.stringify(messages);
    if (submittedMessage && chatFingerprint !== submittedChatFingerprint && messages.findLast(message => message.role === 'user')?.text === submittedMessage) {
      if (chatInput.value.trim() === submittedMessage) chatInput.value = '';
      submittedMessage = null;
    }
    submitting = state.chat_busy;
    updateSend();
    if (chatFingerprint === renderedChat) return;
    renderedChat = chatFingerprint;
    if (!messages.length) {
      chatMessages.replaceChildren(element('p', 'chat-empty', EMPTY_CHAT));
      return;
    }
    const atBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 40;
    const fragment = document.createDocumentFragment();
    for (const message of messages) {
      const bubble = element('div', `message ${message.role}`, '');
      const sender = message.role === 'user' ? 'You' : message.role === 'error' ? 'Oops' : 'Yumon';
      bubble.append(element('small', '', sender), element('p', '', message.text));
      fragment.append(bubble);
    }
    chatMessages.replaceChildren(fragment);
    if (atBottom || submittedMessage) chatMessages.scrollTop = chatMessages.scrollHeight;
  };
  showSim('ant');
  send('ready');
</script>
</body>
</html>
